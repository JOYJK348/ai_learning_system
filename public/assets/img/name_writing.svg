<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/></filter>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="18" fill="url(#g)" filter="url(#sh)"/>
  <!-- notebook lines -->
  <rect x="15" y="45" width="70" height="4" rx="2" fill="white" opacity="0.3"/>
  <rect x="15" y="57" width="70" height="4" rx="2" fill="white" opacity="0.3"/>
  <rect x="15" y="69" width="70" height="4" rx="2" fill="white" opacity="0.3"/>
  <!-- pencil -->
  <rect x="38" y="12" width="24" height="55" rx="5" fill="#fde68a" filter="url(#sh)" transform="rotate(20 50 40)"/>
  <polygon points="50,70 44,82 56,82" fill="#fcd34d" transform="rotate(20 50 75)"/>
  <rect x="38" y="12" width="24" height="10" rx="5" fill="#e5e7eb" transform="rotate(20 50 17)"/>
  <!-- sparkle dots -->
  <circle cx="22" cy="22" r="4" fill="#f0abfc" opacity="0.8"/>
  <circle cx="80" cy="25" r="3" fill="#fde68a" opacity="0.8"/>
  <circle cx="75" cy="78" r="4" fill="#a5f3fc" opacity="0.8"/>
</svg>