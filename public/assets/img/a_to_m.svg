  <text x="72" y="40" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" transform="rotate(15 72 32)">B</text>

  <rect x="35" y="55" width="35" height="35" rx="8" fill="url(#grad3)" filter="url(#shadow)" />
  <text x="52" y="80" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">M</text>
